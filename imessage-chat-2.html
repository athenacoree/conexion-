<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title></title>
<style>
  :root{
    --blue-1:#2F8CFF;
    --blue-2:#0B6CFF;
    --gray-bubble:#E9E9EB;
    --gray-bubble-text:#111114;
    --bg:#FFFFFF;
    --divider:rgba(60,60,67,0.29);
    --system-gray:#8E8E93;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html,body{
    height:100%;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
    overflow:hidden;
  }

  /* ============ APP CONTAINER (pantalla completa) ============ */
  .app{
    width:100%;
    height:100dvh;
    height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ============ HEADER ============ */
  .chat-header{
    position:relative;
    z-index:50;
    padding-top:calc(var(--safe-top) + 8px);
    padding-bottom:8px;
    padding-left:6px;
    padding-right:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:rgba(248,248,248,0.85);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    backdrop-filter:saturate(180%) blur(20px);
    border-bottom:0.5px solid var(--divider);
    flex-shrink:0;
    min-height:44px;
  }

  .header-left{
    display:flex;
    align-items:center;
    gap:6px;
    min-width:0;
  }

  .back-btn{
    display:flex;
    align-items:center;
    gap:2px;
    color:var(--blue-2);
    font-size:17px;
    padding:4px 4px;
    background:none;
    border:none;
    flex-shrink:0;
  }
  .back-btn svg{width:11px;height:18px;}

  .header-identity{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
  }
  .header-avatar{
    width:34px;height:34px;
    border-radius:50%;
    background:#c7c7cc;
    display:flex;align-items:center;justify-content:center;
    color:#fff;
    flex-shrink:0;
    box-shadow:inset 0 1px 1px rgba(255,255,255,0.4);
  }
  .header-avatar svg{width:19px;height:19px;fill:#fff;}
  .header-name{
    font-size:15px;
    font-weight:600;
    color:#1c1c1e;
    min-height:18px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .header-actions{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  .icon-btn{
    width:32px;height:32px;
    border-radius:50%;
    border:none;
    background:rgba(11,108,255,0.09);
    color:var(--blue-2);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    transition:background 0.15s, transform 0.12s;
  }
  .icon-btn svg{width:15.5px;height:15.5px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .icon-btn:active{background:rgba(11,108,255,0.2);transform:scale(0.92);}

  /* ============ MESSAGES ============ */
  .messages{
    flex:1;
    overflow-y:auto;
    padding:14px 12px 10px;
    display:flex;
    flex-direction:column;
    gap:2px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .messages::-webkit-scrollbar{display:none;}

  .empty-state{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--system-gray);
    font-size:14px;
    text-align:center;
    padding:0 40px;
  }

  .date-stamp{
    text-align:center;
    font-size:11px;
    font-weight:600;
    color:var(--system-gray);
    margin:10px 0 14px;
    letter-spacing:0.2px;
  }

  .row{
    display:flex;
    width:100%;
    margin:1.5px 0;
  }
  .row.sent{justify-content:flex-end;}
  .row.received{justify-content:flex-start;}
  .row.group-start{margin-top:10px;}

  .avatar-mini{
    width:26px;height:26px;
    border-radius:50%;
    background:#c7c7cc;
    margin-right:7px;
    flex-shrink:0;
    align-self:flex-end;
    display:flex;align-items:center;justify-content:center;
  }
  .avatar-mini svg{width:14px;height:14px;fill:#fff;}
  .avatar-spacer{width:33px;flex-shrink:0;}

  .bubble-wrap{
    max-width:74%;
    display:flex;
    flex-direction:column;
  }
  .row.sent .bubble-wrap{align-items:flex-end;}
  .row.received .bubble-wrap{align-items:flex-start;}

  .bubble{
    position:relative;
    padding:8px 14px;
    font-size:16.5px;
    line-height:1.28;
    word-wrap:break-word;
    border-radius:19px;
    transform-origin:bottom right;
  }
  .row.received .bubble{transform-origin:bottom left;}

  .bubble.sent{
    background:linear-gradient(180deg,var(--blue-1),var(--blue-2));
    color:#fff;
    border-bottom-right-radius:5px;
  }
  .bubble.received{
    background:var(--gray-bubble);
    color:var(--gray-bubble-text);
    border-bottom-left-radius:5px;
  }
  .row.group-mid .bubble.sent{border-bottom-right-radius:19px;border-top-right-radius:6px;}
  .row.group-mid .bubble.received{border-bottom-left-radius:19px;border-top-left-radius:6px;}

  .bubble.sent.tail::after{
    content:'';
    position:absolute;
    bottom:0;right:-7px;
    width:16px;height:17px;
    background:var(--blue-2);
    border-bottom-left-radius:14px;
    -webkit-mask:radial-gradient(circle 9px at 0 0, transparent 9px, black 9.5px);
    mask:radial-gradient(circle 9px at 0 0, transparent 9px, black 9.5px);
  }
  .bubble.received.tail::before{
    content:'';
    position:absolute;
    bottom:0;left:-7px;
    width:16px;height:17px;
    background:var(--gray-bubble);
    border-bottom-right-radius:14px;
    -webkit-mask:radial-gradient(circle 9px at 100% 0, transparent 9px, black 9.5px);
    mask:radial-gradient(circle 9px at 100% 0, transparent 9px, black 9.5px);
  }

  .msg-time{
    font-size:10.5px;
    color:var(--system-gray);
    margin:3px 8px 0;
  }
  .read-receipt{
    font-size:10.5px;
    color:var(--system-gray);
    margin:3px 4px 0;
    align-self:flex-end;
  }

  /* Choque contra el borde de la pantalla al enviar/recibir */
  @keyframes impactRight{
    0%{transform:translateX(70px) scale(0.55);opacity:0;}
    40%{transform:translateX(-10px) scale(1.06);opacity:1;}
    58%{transform:translateX(4px) scaleX(0.95) scaleY(1.04);}
    74%{transform:translateX(-2px) scaleX(1.03) scaleY(0.98);}
    88%{transform:translateX(1px) scaleX(0.99) scaleY(1.01);}
    100%{transform:translateX(0) scale(1);}
  }
  @keyframes impactLeft{
    0%{transform:translateX(-70px) scale(0.55);opacity:0;}
    40%{transform:translateX(10px) scale(1.06);opacity:1;}
    58%{transform:translateX(-4px) scaleX(0.95) scaleY(1.04);}
    74%{transform:translateX(2px) scaleX(1.03) scaleY(0.98);}
    88%{transform:translateX(-1px) scaleX(0.99) scaleY(1.01);}
    100%{transform:translateX(0) scale(1);}
  }
  .row.animate-sent .bubble,
  .row.animate-sent .photo-bubble{animation:impactRight 0.5s cubic-bezier(.22,.85,.4,1) both;}
  .row.animate-received .bubble,
  .row.animate-received .photo-bubble{animation:impactLeft 0.5s cubic-bezier(.22,.85,.4,1) both;}

  /* Icono de "responder" revelado al arrastrar un mensaje */
  .reply-icon{
    position:absolute;
    left:-36px;
    top:50%;
    width:26px;height:26px;
    border-radius:50%;
    background:rgba(120,120,128,0.14);
    display:flex;align-items:center;justify-content:center;
    color:var(--system-gray);
    opacity:0;
    transform:translateY(-50%) scale(0.4);
    pointer-events:none;
  }
  .reply-icon svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;}

  /* Balanceo del mensaje mientras se arrastra para responder */
  @keyframes wobbleRock{
    0%,100%{rotate:0deg;}
    25%{rotate:-2.2deg;}
    75%{rotate:2.2deg;}
  }
  .bubble.wobbling,
  .photo-bubble.wobbling{
    animation:wobbleRock 0.32s ease-in-out infinite;
  }

  .typing-row{display:none;align-items:center;}
  .typing-row.show{display:flex;}
  .typing-bubble{
    background:var(--gray-bubble);
    border-radius:19px;
    border-bottom-left-radius:5px;
    padding:11px 16px;
    display:flex;
    gap:4px;
    align-items:center;
  }
  .typing-dot{
    width:7px;height:7px;
    border-radius:50%;
    background:#a8a8ad;
    animation:typingBounce 1.1s infinite ease-in-out;
  }
  .typing-dot:nth-child(2){animation-delay:0.15s;}
  .typing-dot:nth-child(3){animation-delay:0.3s;}
  @keyframes typingBounce{
    0%,60%,100%{transform:translateY(0);opacity:0.5;}
    30%{transform:translateY(-4px);opacity:1;}
  }

  /* ============ PHOTO MESSAGES ============ */
  .photo-bubble{
    position:relative;
    width:210px;
    height:270px;
    border-radius:19px;
    overflow:hidden;
    cursor:pointer;
    background:var(--gray-bubble);
    user-select:none;
    -webkit-user-select:none;
    transition:transform 0.15s ease;
  }
  .photo-bubble.pressed{transform:scale(0.96);}
  .photo-bubble img{
    width:100%;height:100%;object-fit:cover;
    display:block;
    pointer-events:none;
  }
  .row.group-start .photo-bubble{border-bottom-right-radius:5px;}
  .row.received .photo-bubble{border-bottom-left-radius:5px;}

  /* ============ INPUT BAR ============ */
  .input-bar{
    flex-shrink:0;
    display:flex;
    align-items:flex-end;
    gap:8px;
    padding:8px 8px calc(8px + var(--safe-bottom));
    background:rgba(248,248,248,0.92);
    -webkit-backdrop-filter:blur(20px);
    backdrop-filter:blur(20px);
    border-top:0.5px solid var(--divider);
  }
  .plus-btn{
    width:32px;height:32px;
    border-radius:50%;
    border:1.5px solid #c7c7cc;
    background:none;
    display:flex;align-items:center;justify-content:center;
    color:#8e8e93;
    flex-shrink:0;
    margin-bottom:2px;
  }
  .plus-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;}
  .input-pill{
    flex:1;
    min-height:34px;
    max-height:100px;
    border-radius:18px;
    background:#fff;
    border:1px solid #d5d5da;
    padding:7px 14px;
    font-size:16.5px;
    color:#1c1c1e;
    outline:none;
    overflow-y:auto;
    line-height:1.3;
  }
  .input-pill:empty::before{
    content:attr(data-placeholder);
    color:#a9a9ae;
  }
  .send-btn{
    width:32px;height:32px;
    border-radius:50%;
    background:#c7c7cc;
    border:none;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    margin-bottom:2px;
    transition:background 0.2s, transform 0.15s;
  }
  .send-btn.active{
    background:var(--blue-2);
  }
  .send-btn svg{width:15px;height:15px;fill:#fff;}
  .send-btn:active{transform:scale(0.88);}

  /* ============ LONG-PRESS PREVIEW OVERLAY ============ */
  .preview-overlay{
    position:fixed;
    inset:0;
    z-index:900;
    background:rgba(20,20,22,0.0);
    -webkit-backdrop-filter:blur(0px) saturate(120%);
    backdrop-filter:blur(0px) saturate(120%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:background 0.32s ease, backdrop-filter 0.32s ease;
  }
  .preview-overlay.show{
    opacity:1;
    pointer-events:auto;
    background:rgba(20,20,22,0.35);
    -webkit-backdrop-filter:blur(28px) saturate(140%);
    backdrop-filter:blur(28px) saturate(140%);
  }
  .preview-stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    transform:scale(0.86);
    opacity:0;
    transition:transform 0.34s cubic-bezier(.2,1.15,.35,1), opacity 0.28s ease;
  }
  .preview-overlay.show .preview-stage{
    transform:scale(1);
    opacity:1;
  }
  .preview-image{
    width:270px;
    height:340px;
    border-radius:24px;
    object-fit:cover;
    box-shadow:0 20px 50px rgba(0,0,0,0.45);
  }

  .action-panel{
    width:250px;
    border-radius:16px;
    overflow:hidden;
    background:rgba(250,250,252,0.78);
    -webkit-backdrop-filter:blur(30px) saturate(180%);
    backdrop-filter:blur(30px) saturate(180%);
    box-shadow:0 15px 40px rgba(0,0,0,0.3);
  }
  .action-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12.5px 16px;
    font-size:16px;
    color:#1c1c1e;
    border-bottom:0.5px solid rgba(60,60,67,0.22);
    background:transparent;
    -webkit-user-select:none;
    user-select:none;
    transition:background 0.1s;
  }
  .action-item:last-child{border-bottom:none;}
  .action-item:active{background:rgba(0,0,0,0.06);}
  .action-item.destructive{color:#FF3B30;}
  .action-item .icon{
    width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;
    color:#1c1c1e;
  }
  .action-item.destructive .icon{color:#FF3B30;}
  .action-item .icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}

  .close-hint{
    color:rgba(255,255,255,0.65);
    font-size:12.5px;
    margin-top:2px;
  }

  .photo-bubble.dragging{opacity:0.4;}

  /* toast */
  .toast{
    position:fixed;
    bottom:110px;
    left:50%;
    transform:translateX(-50%) translateY(10px);
    background:rgba(30,30,32,0.88);
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    color:#fff;
    padding:10px 18px;
    border-radius:14px;
    font-size:14px;
    font-weight:500;
    z-index:1000;
    opacity:0;
    transition:opacity 0.25s ease, transform 0.25s ease;
    pointer-events:none;
    display:flex;
    align-items:center;
    gap:7px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast svg{width:16px;height:16px;fill:#34C759;}
</style>
</head>
<body>

<div class="app">

  <div class="chat-header">
    <div class="header-left">
      <button class="back-btn" aria-label="Volver">
        <svg viewBox="0 0 12 20"><path d="M11 1L2 10l9 9" stroke="#0B6CFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="header-identity">
        <div class="header-avatar">
          <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 6v2h18v-2c0-3.5-4-6-9-6z"/></svg>
        </div>
        <div class="header-name" id="headerName"></div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="callBtn" aria-label="Llamar" title="Llamar">
        <svg viewBox="0 0 24 24"><path d="M4 6c0 7.7 6.3 14 14 14 .6 0 1-.4 1-1v-3.2c0-.5-.3-.9-.8-1l-3.3-.7c-.4-.1-.8.1-1.1.4l-1 1.2a11.3 11.3 0 0 1-5.5-5.5l1.2-1c.3-.3.5-.7.4-1.1L8.2 4.8c-.1-.5-.5-.8-1-.8H4c-.6 0-1 .4-1 1z"/></svg>
      </button>
      <button class="icon-btn" id="screenShareBtn" aria-label="Compartir pantalla" title="Compartir pantalla">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 21v-3.5"/><path d="M9 10.5L12 7.5l3 3"/><path d="M12 7.5v6"/></svg>
      </button>
      <button class="icon-btn" id="audioShareBtn" aria-label="Compartir audio en vivo" title="Compartir audio en vivo">
        <svg viewBox="0 0 24 24"><path d="M4 12.5v-1a8 8 0 0 1 16 0v1"/><rect x="2" y="12.5" width="4" height="6" rx="1.5"/><rect x="18" y="12.5" width="4" height="6" rx="1.5"/></svg>
      </button>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">Aquí aparecerán los mensajes de esta conversación</div>
    <div class="row typing-row" id="typingRow">
      <div class="avatar-mini"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 6v2h18v-2c0-3.5-4-6-9-6z"/></svg></div>
      <div class="typing-bubble">
        <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <button class="plus-btn" aria-label="Adjuntar">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <div class="input-pill" id="inputPill" contenteditable="true" data-placeholder="Mensaje"></div>
    <button class="send-btn" id="sendBtn" aria-label="Enviar">
      <svg viewBox="0 0 24 24"><path d="M12 4l7 7h-4v9h-6v-9H5z"/></svg>
    </button>
  </div>

  <!-- Panel de previsualización al mantener presionada una foto -->
  <div class="preview-overlay" id="previewOverlay">
    <div class="preview-stage" id="previewStage">
      <img class="preview-image" id="previewImg" src="" alt="">
      <div class="action-panel">
        <div class="action-item" data-action="reply">
          <span>Responder</span>
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M9 10L3 14l6 4M3 14h11a6 6 0 0 0 6-6V6"/></svg></span>
        </div>
        <div class="action-item" data-action="forward">
          <span>Reenviar</span>
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M15 10l6 4-6 4M21 14H10a6 6 0 0 1-6-6V6"/></svg></span>
        </div>
        <div class="action-item" data-action="save">
          <span>Guardar en galería</span>
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 3v13m0 0l-4-4m4 4l4-4M4 17v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></span>
        </div>
        <div class="action-item" data-action="edit">
          <span>Editar</span>
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>
        </div>
        <div class="action-item" data-action="status">
          <span>Subir a mi estado</span>
          <span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></span>
        </div>
        <div class="action-item" data-action="copy">
          <span>Copiar</span>
          <span class="icon"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg></span>
        </div>
        <div class="action-item destructive" data-action="delete">
          <span>Eliminar</span>
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/></svg></span>
        </div>
      </div>
      <div class="close-hint">Toca fuera para cerrar</div>
    </div>
  </div>

  <div class="toast" id="toast">
    <svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
    <span id="toastText"></span>
  </div>
</div>

<script>
(function(){
  const messages   = document.getElementById('messages');
  const emptyState = document.getElementById('emptyState');
  const inputPill  = document.getElementById('inputPill');
  const sendBtn    = document.getElementById('sendBtn');
  const typingRow  = document.getElementById('typingRow');
  const overlay    = document.getElementById('previewOverlay');
  const previewImg = document.getElementById('previewImg');
  const toast      = document.getElementById('toast');
  const toastText  = document.getElementById('toastText');

  const personIcon = '<svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 6v2h18v-2c0-3.5-4-6-9-6z"/></svg>';

  function hideEmptyState(){
    if(emptyState) emptyState.style.display = 'none';
  }

  function makeReplyIcon(){
    const icon = document.createElement('div');
    icon.className = 'reply-icon';
    icon.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 10L3 14l6 4M3 14h11a6 6 0 0 0 6-6V6"/></svg>';
    return icon;
  }

  const REPLY_THRESHOLD = 58;
  const REPLY_MAX = 92;

  // Habilita "arrastrar para responder": mientras se arrastra, el mensaje
  // se balancea (rota) como si estuviera colgando, no el texto en sí.
  function bindReplyGesture(el, getPayload){
    let startX = 0, startY = 0;
    let dx = 0;
    let dragging = false;
    let deciding = false;
    let thresholdReached = false;
    const replyIcon = el.querySelector('.reply-icon');

    function reset(animated){
      dragging = false;
      deciding = false;
      thresholdReached = false;
      el.classList.remove('wobbling');
      if(animated){
        el.style.transition = 'translate 0.35s cubic-bezier(.34,1.56,.64,1)';
      }
      el.style.translate = '0px 0px';
      if(replyIcon){
        replyIcon.style.opacity = 0;
        replyIcon.style.transform = 'translateY(-50%) scale(0.4)';
      }
      setTimeout(() => { el.style.transition = ''; }, 360);
    }

    el.addEventListener('pointerdown', (e) => {
      startX = e.clientX;
      startY = e.clientY;
      dx = 0;
      deciding = true;
      dragging = false;
    });

    el.addEventListener('pointermove', (e) => {
      if(!deciding) return;
      const rawDx = e.clientX - startX;
      const rawDy = e.clientY - startY;

      if(!dragging){
        if(Math.abs(rawDx) > 10 && Math.abs(rawDx) > Math.abs(rawDy)){
          dragging = true;
          el.classList.add('wobbling');
          if(el.setPointerCapture) el.setPointerCapture(e.pointerId);
        } else if(Math.abs(rawDy) > 10){
          deciding = false;
          return;
        } else {
          return;
        }
      }

      dx = Math.max(0, Math.min(REPLY_MAX, rawDx));
      el.style.translate = dx + 'px 0px';

      if(replyIcon){
        const progress = Math.min(1, dx / REPLY_THRESHOLD);
        replyIcon.style.opacity = progress;
        replyIcon.style.transform = 'translateY(-50%) scale(' + (0.4 + 0.6 * progress) + ')';
      }

      if(dx >= REPLY_THRESHOLD && !thresholdReached){
        thresholdReached = true;
        if(navigator.vibrate) navigator.vibrate(10);
      } else if(dx < REPLY_THRESHOLD){
        thresholdReached = false;
      }
    });

    function finish(){
      if(!dragging){ deciding = false; return; }
      if(thresholdReached){
        if(typeof window.onReplyGesture === 'function'){
          window.onReplyGesture(getPayload(), el);
        }
        showToast('Respondiendo al mensaje', true);
      }
      reset(true);
    }

    el.addEventListener('pointerup', finish);
    el.addEventListener('pointercancel', finish);
  }

  function scrollToBottom(){
    messages.scrollTop = messages.scrollHeight;
  }

  /* ---------- API pública para integrar con datos reales ---------- */

  // Agrega un mensaje de texto. sent=true (yo) / false (contacto)
  window.addTextMessage = function(text, sent, opts){
    opts = opts || {};
    if(!text) return;
    hideEmptyState();

    const row = document.createElement('div');
    row.className = 'row ' + (sent ? 'sent' : 'received') + ' group-start' + (opts.animate === false ? '' : (sent ? ' animate-sent' : ' animate-received'));

    if(!sent){
      row.innerHTML = '<div class="avatar-mini">'+personIcon+'</div><div class="bubble-wrap"></div>';
    } else {
      row.innerHTML = '<div class="bubble-wrap"></div>';
    }

    const wrap = row.querySelector('.bubble-wrap');
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (sent ? 'sent' : 'received') + ' tail';
    bubble.textContent = text;
    bubble.appendChild(makeReplyIcon());
    wrap.appendChild(bubble);
    bindReplyGesture(bubble, () => text);

    messages.insertBefore(row, typingRow);
    scrollToBottom();
    return row;
  };

  // Agrega un mensaje de foto. url = fuente real de la imagen a mostrar.
  window.addPhotoMessage = function(url, sent, opts){
    opts = opts || {};
    if(!url) return;
    hideEmptyState();

    const row = document.createElement('div');
    row.className = 'row ' + (sent ? 'sent' : 'received') + ' group-start' + (opts.animate === false ? '' : (sent ? ' animate-sent' : ' animate-received'));

    if(!sent){
      row.innerHTML = '<div class="avatar-mini">'+personIcon+'</div><div class="bubble-wrap"></div>';
    } else {
      row.innerHTML = '<div class="bubble-wrap"></div>';
    }

    const wrap = row.querySelector('.bubble-wrap');
    const photo = document.createElement('div');
    photo.className = 'photo-bubble tail';
    photo.dataset.img = url;
    photo.setAttribute('draggable', 'true');
    photo.innerHTML = '<img src="'+url+'" alt="" draggable="false">';
    photo.appendChild(makeReplyIcon());
    wrap.appendChild(photo);
    bindPhoto(photo);
    bindReplyGesture(photo, () => url);

    messages.insertBefore(row, typingRow);
    scrollToBottom();
    return row;
  };

  window.showTypingIndicator = function(){
    typingRow.classList.add('show');
    scrollToBottom();
  };
  window.hideTypingIndicator = function(){
    typingRow.classList.remove('show');
  };

  window.setHeaderName = function(name){
    document.getElementById('headerName').textContent = name || '';
  };

  /* ---------- barra de entrada ---------- */
  inputPill.addEventListener('input', () => {
    const hasText = inputPill.textContent.trim().length > 0;
    sendBtn.classList.toggle('active', hasText);
  });

  function sendMessage(){
    const text = inputPill.textContent.trim();
    if(!text) return;

    window.addTextMessage(text, true);

    inputPill.textContent = '';
    sendBtn.classList.remove('active');

    if(typeof window.onMessageSend === 'function'){
      window.onMessageSend(text);
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputPill.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });

  /* ---------- botones de llamada / compartir pantalla / compartir audio ---------- */
  document.getElementById('callBtn').addEventListener('click', () => {
    if(typeof window.onCall === 'function') window.onCall();
    else showToast('Llamando…', true);
  });
  document.getElementById('screenShareBtn').addEventListener('click', () => {
    if(typeof window.onScreenShare === 'function') window.onScreenShare();
    else showToast('Compartiendo pantalla…', true);
  });
  document.getElementById('audioShareBtn').addEventListener('click', () => {
    if(typeof window.onAudioShare === 'function') window.onAudioShare();
    else showToast('Compartiendo audio…', true);
  });

  /* ---------- long-press en fotos ---------- */
  let pressTimer = null;
  let activePhoto = null;

  function bindPhoto(el){
    let pressed = false;
    let downX = 0, downY = 0;

    const start = (e) => {
      pressed = true;
      downX = e.clientX;
      downY = e.clientY;
      el.classList.add('pressed');
      pressTimer = setTimeout(() => {
        if(pressed) openPreview(el);
      }, 420);
    };
    const cancel = () => {
      pressed = false;
      el.classList.remove('pressed');
      clearTimeout(pressTimer);
    };
    const moveCheck = (e) => {
      if(!pressed) return;
      const dist = Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY);
      if(dist > 10) cancel();
    };

    el.addEventListener('pointerdown', start);
    el.addEventListener('pointermove', moveCheck);
    el.addEventListener('pointerup', cancel);
    el.addEventListener('pointerleave', cancel);
    el.addEventListener('pointercancel', cancel);
    el.addEventListener('contextmenu', (e) => e.preventDefault());

    el.addEventListener('dragstart', () => {
      el.classList.add('dragging');
      showToast('Arrastrando imagen…', true);
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      hideToast();
    });
  }
  window.bindPhotoInteractions = bindPhoto;

  function openPreview(el){
    activePhoto = el;
    previewImg.src = el.dataset.img;
    overlay.classList.add('show');
    if(navigator.vibrate) navigator.vibrate(8);
  }
  function closePreview(){
    overlay.classList.remove('show');
    activePhoto = null;
  }
  overlay.addEventListener('click', (e) => {
    if(e.target === overlay) closePreview();
  });

  document.querySelectorAll('.action-item').forEach(item => {
    item.addEventListener('click', () => {
      const action = item.dataset.action;
      const photoEl = activePhoto;
      closePreview();

      if(typeof window.onPhotoAction === 'function'){
        window.onPhotoAction(action, photoEl ? photoEl.dataset.img : null, photoEl);
      }

      const labels = {
        reply: 'Respondiendo al mensaje',
        forward: 'Elige un chat para reenviar',
        save: 'Guardado en galería',
        edit: 'Abriendo editor…',
        status: 'Subido a tu estado',
        copy: 'Imagen copiada',
        delete: 'Mensaje eliminado'
      };
      showToast(labels[action] || '', action !== 'delete');

      if(action === 'delete' && photoEl){
        const row = photoEl.closest('.row');
        row.style.transition = 'opacity 0.25s, transform 0.25s';
        row.style.opacity = '0';
        row.style.transform = 'scale(0.85)';
        setTimeout(() => row.remove(), 250);
      }
    });
  });

  let toastTimer;
  function showToast(text, success){
    if(!text) return;
    toastText.textContent = text;
    toast.querySelector('svg').style.display = success ? 'block' : 'none';
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 1800);
  }
  function hideToast(){
    toast.classList.remove('show');
  }
  window.showToast = showToast;

})();
</script>

</body>
