<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chats</title>
<style>
  :root{
    --blue-1:#2F8CFF;
    --blue-2:#0B6CFF;
    --gray-bubble:#E9E9EB;
    --bg:#000000;
    --bg-2:#0D0D0F;
    --divider:rgba(84,84,88,0.42);
    --system-gray:#8E8E93;
    --card:#1C1C1E;
    --card-2:#232326;
    --green:#34C759;
    --red:#FF3B30;
    --yellow:#FFD60A;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html,body{
    height:100%;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
    overflow:hidden;
    color:#fff;
  }

  /* ============ APP CONTAINER ============ */
  .app{
    width:100%;
    height:100dvh;
    height:100vh;
    background:linear-gradient(180deg,#000 0%,#050505 100%);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
  }

  /* ============ LARGE TITLE HEADER ============ */
  .top-header{
    position:relative;
    z-index:50;
    padding-top:calc(var(--safe-top) + 6px);
    padding-left:16px;
    padding-right:16px;
    flex-shrink:0;
    background:rgba(10,10,12,0.82);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    backdrop-filter:saturate(180%) blur(20px);
  }
  .top-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    height:30px;
  }
  .top-bar .status-text{
    font-size:13px;
    color:var(--system-gray);
    display:flex;
    align-items:center;
    gap:5px;
  }
  .top-bar .status-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--green);
    box-shadow:0 0 6px rgba(52,199,89,0.8);
  }
  .edit-btn{
    background:none;border:none;
    color:var(--blue-1);
    font-size:16px;
    padding:4px 2px;
  }
  .edit-btn:active{opacity:0.5;}

  .title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:2px 0 10px;
  }
  .big-title{
    font-size:33px;
    font-weight:800;
    letter-spacing:-0.4px;
  }
  .compose-btn{
    width:34px;height:34px;
    border-radius:50%;
    background:rgba(11,108,255,0.14);
    border:none;
    display:flex;align-items:center;justify-content:center;
    color:var(--blue-1);
    transition:transform 0.12s, background 0.15s;
  }
  .compose-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .compose-btn:active{transform:scale(0.9);background:rgba(11,108,255,0.28);}

  .search-wrap{
    padding-bottom:10px;
  }
  .search-pill{
    height:36px;
    border-radius:11px;
    background:rgba(118,118,128,0.24);
    display:flex;
    align-items:center;
    gap:6px;
    padding:0 10px;
  }
  .search-pill svg{width:16px;height:16px;stroke:var(--system-gray);fill:none;stroke-width:2;flex-shrink:0;}
  .search-pill input{
    flex:1;
    background:none;
    border:none;
    outline:none;
    color:#fff;
    font-size:16px;
  }
  .search-pill input::placeholder{color:var(--system-gray);}

  .segmented{
    display:flex;
    gap:6px;
    padding-bottom:10px;
  }
  .seg-item{
    flex:1;
    text-align:center;
    padding:6px 0;
    font-size:13.5px;
    font-weight:600;
    color:var(--system-gray);
    border-radius:9px;
    background:rgba(118,118,128,0.16);
    transition:background 0.15s,color 0.15s;
  }
  .seg-item.active{
    background:rgba(118,118,128,0.34);
    color:#fff;
  }

  /* ============ CHAT LIST ============ */
  .list-scroll{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding-bottom:calc(90px + var(--safe-bottom));
  }
  .list-scroll::-webkit-scrollbar{display:none;}

  .section-label{
    font-size:12px;
    font-weight:700;
    color:var(--system-gray);
    letter-spacing:0.4px;
    padding:14px 16px 6px;
    text-transform:uppercase;
  }

  .swipe-track{
    position:relative;
    overflow:hidden;
  }
  .swipe-actions{
    position:absolute;
    top:0;right:0;bottom:0;
    display:flex;
  }
  .swipe-action{
    width:74px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    color:#fff;
    font-size:11px;
    font-weight:600;
    border:none;
  }
  .swipe-action svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .swipe-action.mute{background:#FF9F0A;}
  .swipe-action.pin{background:#8E8E93;}
  .swipe-action.delete{background:var(--red);}

  .chat-row{
    position:relative;
    display:flex;
    align-items:center;
    gap:12px;
    padding:9px 16px;
    background:var(--bg);
    transition:transform 0.28s cubic-bezier(.2,.9,.3,1), background 0.15s;
    touch-action:pan-y;
  }
  .chat-row.pressed{background:rgba(255,255,255,0.06);}
  .chat-row.selected-clone{
    background:var(--bg);
  }
  .chat-row .divider{
    position:absolute;
    left:76px;right:0;bottom:0;
    height:0.5px;
    background:var(--divider);
  }

  .avatar-wrap{
    position:relative;
    flex-shrink:0;
  }
  .avatar{
    width:54px;height:54px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:19px;
    font-weight:600;
    color:#fff;
    background:linear-gradient(160deg,#8E8E93,#636366);
    overflow:hidden;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .presence-dot{
    position:absolute;
    right:1px;bottom:1px;
    width:14px;height:14px;
    border-radius:50%;
    background:var(--green);
    border:2.5px solid #000;
  }
  .presence-dot.offline{background:#636366;}

  .row-body{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:2px;
    padding:2px 0;
    border-bottom:0.5px solid transparent;
  }
  .row-line1{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .chat-name{
    font-size:17px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .pin-ic{width:12px;height:12px;flex-shrink:0;color:var(--system-gray);}
  .pin-ic svg{width:100%;height:100%;fill:currentColor;}
  .chat-time{
    font-size:13.5px;
    color:var(--system-gray);
    flex-shrink:0;
  }
  .chat-row.unread .chat-time{color:var(--blue-1);font-weight:600;}

  .row-line2{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .chat-snippet{
    font-size:14.5px;
    color:var(--system-gray);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:1;
  }
  .chat-row.unread .chat-snippet{color:#c9c9cc;}
  .typing-inline{color:var(--green);font-weight:500;}

  .unread-badge{
    min-width:20px;
    height:20px;
    border-radius:10px;
    background:var(--blue-1);
    color:#fff;
    font-size:12px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 6px;
    flex-shrink:0;
  }

  .empty-state{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:70px 40px 0;
    color:var(--system-gray);
  }
  .empty-state .empty-icon{
    width:64px;height:64px;
    border-radius:20px;
    background:rgba(118,118,128,0.18);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:18px;
  }
  .empty-state .empty-icon svg{width:30px;height:30px;stroke:var(--system-gray);fill:none;stroke-width:1.6;}
  .empty-state h3{font-size:18px;font-weight:700;color:#fff;margin-bottom:6px;}
  .empty-state p{font-size:14.5px;line-height:1.4;max-width:260px;}

  /* ============ BOTTOM TAB BAR ============ */
  .tab-bar{
    position:absolute;
    left:0;right:0;bottom:0;
    display:flex;
    padding-top:6px;
    padding-bottom:calc(4px + var(--safe-bottom));
    background:rgba(10,10,12,0.82);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    backdrop-filter:saturate(180%) blur(20px);
    border-top:0.5px solid var(--divider);
  }
  .tab-item{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    color:var(--system-gray);
    font-size:10.5px;
    font-weight:500;
    padding:2px 0;
  }
  .tab-item svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .tab-item.active{color:var(--blue-1);}
  .tab-item.active svg{fill:rgba(11,108,255,0.14);}
  .tab-badge{
    position:relative;
  }
  .tab-badge::after{
    content:attr(data-count);
    position:absolute;
    top:-3px;right:-9px;
    min-width:15px;height:15px;
    border-radius:8px;
    background:var(--red);
    color:#fff;
    font-size:9.5px;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
    padding:0 3px;
  }

  /* ============ LONG-PRESS CONTEXT MENU (cristal / blur) ============ */
  .ctx-overlay{
    position:fixed;
    inset:0;
    z-index:900;
    background:rgba(0,0,0,0);
    -webkit-backdrop-filter:blur(0px) saturate(120%);
    backdrop-filter:blur(0px) saturate(120%);
    opacity:0;
    pointer-events:none;
    transition:background 0.32s ease;
  }
  .ctx-overlay.show{
    opacity:1;
    pointer-events:auto;
    background:rgba(0,0,0,0.28);
    -webkit-backdrop-filter:blur(22px) saturate(150%);
    backdrop-filter:blur(22px) saturate(150%);
  }
  .ctx-clone{
    position:fixed;
    left:0;right:0;
    z-index:901;
    display:flex;
    align-items:center;
    gap:12px;
    padding:9px 16px;
    background:var(--card);
    border-radius:14px;
    margin:0 8px;
    box-shadow:0 20px 45px rgba(0,0,0,0.45);
    transform:scale(0.94);
    opacity:0;
    transition:transform 0.3s cubic-bezier(.22,1.1,.36,1), opacity 0.22s ease;
    pointer-events:none;
  }
  .ctx-overlay.show .ctx-clone{
    transform:scale(1.03);
    opacity:1;
  }
  .ctx-menu{
    position:fixed;
    left:0;right:0;
    z-index:901;
    width:240px;
    margin:0 auto;
    border-radius:16px;
    overflow:hidden;
    background:rgba(58,58,60,0.72);
    -webkit-backdrop-filter:blur(34px) saturate(180%);
    backdrop-filter:blur(34px) saturate(180%);
    box-shadow:0 20px 45px rgba(0,0,0,0.4);
    transform:scale(0.85);
    opacity:0;
    transition:transform 0.3s cubic-bezier(.22,1.1,.36,1) 0.03s, opacity 0.24s ease;
  }
  .ctx-overlay.show .ctx-menu{
    transform:scale(1);
    opacity:1;
  }
  .ctx-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12.5px 16px;
    font-size:16.5px;
    color:#fff;
    border-bottom:0.5px solid rgba(255,255,255,0.14);
    -webkit-user-select:none;
    user-select:none;
    transition:background 0.1s;
  }
  .ctx-item:last-child{border-bottom:none;}
  .ctx-item:active{background:rgba(255,255,255,0.12);}
  .ctx-item.destructive{color:var(--red);}
  .ctx-item .ic{
    width:21px;height:21px;
    display:flex;align-items:center;justify-content:center;
  }
  .ctx-item .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}

  /* toast */
  .toast{
    position:fixed;
    bottom:110px;
    left:50%;
    transform:translateX(-50%) translateY(10px);
    background:rgba(40,40,42,0.9);
    -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px);
    color:#fff;
    padding:10px 18px;
    border-radius:14px;
    font-size:14px;
    font-weight:500;
    z-index:1000;
    opacity:0;
    transition:opacity 0.25s ease, transform 0.25s ease;
    pointer-events:none;
    display:flex;
    align-items:center;
    gap:7px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast svg{width:16px;height:16px;fill:var(--green);}
</style>
</head>
<body>

<div class="app">

  <div class="top-header">
    <div class="title-row">
      <div class="big-title">Chats</div>
      <div style="display:flex;align-items:center;gap:14px;">
        <button class="edit-btn" id="editBtn">Editar</button>
        <button class="compose-btn" id="composeBtn" aria-label="Nuevo chat">
          <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </button>
      </div>
    </div>
    <div class="search-wrap">
      <div class="search-pill">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Buscar">
      </div>
    </div>
    <div class="segmented">
      <div class="seg-item active" data-filter="all">Todos</div>
      <div class="seg-item" data-filter="unread">No leídos</div>
      <div class="seg-item" data-filter="pinned">Fijados</div>
    </div>
  </div>

  <div class="list-scroll" id="listScroll">
    <div class="section-label" id="sectionLabel" style="display:none;">Cerca de ti</div>
    <div id="chatList"></div>
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      </div>
      <h3>Sin contactos activos</h3>
      <p>Escanea dispositivos en la pestaña Escáner para iniciar un chat directo P2P.</p>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item">
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 1 3.3 6.5"/><path d="M4 12V6"/><path d="M4 12H2"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/></svg>
      <span>Escáner</span>
    </div>
    <div class="tab-item active">
      <svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span class="tab-badge" id="chatsTabBadge">Chats</span>
    </div>
    <div class="tab-item">
      <svg viewBox="0 0 24 24"><path d="M12 3v13m0 0l-4-4m4 4l4-4M4 17v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      <span>Envíos</span>
    </div>
    <div class="tab-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="M17 9l4-2.5v11L17 15"/></svg>
      <span>Media</span>
    </div>
    <div class="tab-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span>Ajustes</span>
    </div>
  </div>

  <!-- Overlay de opciones al mantener presionado un chat -->
  <div class="ctx-overlay" id="ctxOverlay">
    <div class="ctx-clone" id="ctxClone"></div>
    <div class="ctx-menu" id="ctxMenu">
      <div class="ctx-item" data-action="pin">
        <span id="pinLabel">Fijar</span>
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 2l1.5 5.5L19 9l-4.5 3.5L16 18l-4-3-4 3 1.5-5.5L5 9l5.5-1.5z"/></svg></span>
      </div>
      <div class="ctx-item" data-action="unread">
        <span id="unreadLabel">Marcar como no leído</span>
        <span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/></svg></span>
      </div>
      <div class="ctx-item" data-action="mute">
        <span id="muteLabel">Silenciar</span>
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M23 9l-6 6M17 9l6 6"/></svg></span>
      </div>
      <div class="ctx-item" data-action="transfer">
        <span>Transferir archivo</span>
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3v13m0 0l-4-4m4 4l4-4M4 17v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></span>
      </div>
      <div class="ctx-item" data-action="info">
        <span>Info de contacto</span>
        <span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg></span>
      </div>
      <div class="ctx-item destructive" data-action="delete">
        <span>Eliminar chat</span>
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/></svg></span>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">
    <svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
    <span id="toastText"></span>
  </div>
</div>

<script>
(function(){
  const chatList    = document.getElementById('chatList');
  const emptyState  = document.getElementById('emptyState');
  const sectionLabel= document.getElementById('sectionLabel');
  const searchInput = document.getElementById('searchInput');
  const ctxOverlay  = document.getElementById('ctxOverlay');
  const ctxClone    = document.getElementById('ctxClone');
  const ctxMenu     = document.getElementById('ctxMenu');
  const toast       = document.getElementById('toast');
  const toastText   = document.getElementById('toastText');
  const chatsTabBadge = document.getElementById('chatsTabBadge');

  /* -------- estado en memoria -------- */
  const chats = new Map(); // id -> data
  let activeFilter = 'all';
  let activeChatId = null; // chat con el menú contextual abierto

  const personIcon = '<svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 6v2h18v-2c0-3.5-4-6-9-6z"/></svg>';

  function initials(name){
    if(!name) return '?';
    const parts = name.trim().split(/\s+/);
    return ((parts[0]?.[0]||'') + (parts[1]?.[0]||'')).toUpperCase();
  }

  function formatSnippet(c){
    if(c.typing) return '<span class="typing-inline">escribiendo…</span>';
    return (c.lastMessage || '').replace(/</g,'&lt;');
  }

  function updateUnreadTabBadge(){
    let total = 0;
    chats.forEach(c => { if(c.unread > 0) total++; });
    if(total > 0){
      chatsTabBadge.classList.add('tab-badge');
      chatsTabBadge.dataset.count = total > 99 ? '99+' : total;
    } else {
      chatsTabBadge.classList.remove('tab-badge');
      chatsTabBadge.removeAttribute('data-count');
    }
  }

  function passesFilter(c){
    if(activeFilter === 'unread') return c.unread > 0;
    if(activeFilter === 'pinned') return !!c.pinned;
    return true;
  }
  function passesSearch(c){
    const q = searchInput.value.trim().toLowerCase();
    if(!q) return true;
    return (c.name||'').toLowerCase().includes(q);
  }

  function sortedChats(){
    return Array.from(chats.values())
      .filter(c => passesFilter(c) && passesSearch(c))
      .sort((a,b) => {
        if(!!b.pinned - !!a.pinned !== 0) return (!!b.pinned) - (!!a.pinned);
        return (b.sortTime||0) - (a.sortTime||0);
      });
  }

  function renderRowHTML(c){
    const avatarInner = c.avatarUrl
      ? '<img src="'+c.avatarUrl+'" alt="">'
      : (c.avatarText ? c.avatarText : personIcon);
    const pinIcon = c.pinned ? '<span class="pin-ic"><svg viewBox="0 0 24 24"><path d="M12 2l1.5 5.5L19 9l-4.5 3.5L16 18l-4-3-4 3 1.5-5.5L5 9l5.5-1.5z"/></svg></span>' : '';
    const badge = c.unread > 0 ? '<div class="unread-badge">'+(c.unread>99?'99+':c.unread)+'</div>' : '';
    const presence = c.online === undefined ? '' : '<div class="presence-dot '+(c.online?'':'offline')+'"></div>';
    return `
      <div class="avatar-wrap">
        <div class="avatar" style="${c.avatarColor?('background:'+c.avatarColor+';'):''}">${avatarInner}</div>
        ${presence}
      </div>
      <div class="row-body">
        <div class="row-line1">
          <div class="chat-name">${pinIcon}${(c.name||'').replace(/</g,'&lt;')}</div>
          <div class="chat-time">${c.time||''}</div>
        </div>
        <div class="row-line2">
          <div class="chat-snippet">${formatSnippet(c)}</div>
          ${badge}
        </div>
      </div>
    `;
  }

  function render(){
    const list = sortedChats();
    chatList.innerHTML = '';
    emptyState.style.display = (chats.size === 0) ? 'flex' : 'none';
    sectionLabel.style.display = (list.length > 0) ? 'block' : 'none';

    if(list.length === 0 && chats.size > 0){
      const noRes = document.createElement('div');
      noRes.style.cssText = 'padding:40px 20px;text-align:center;color:var(--system-gray);font-size:14.5px;';
      noRes.textContent = activeFilter === 'unread' ? 'No tienes chats sin leer' : (activeFilter === 'pinned' ? 'No tienes chats fijados' : 'Sin resultados');
      chatList.appendChild(noRes);
      updateUnreadTabBadge();
      return;
    }

    list.forEach(c => {
      const track = document.createElement('div');
      track.className = 'swipe-track';
      track.dataset.id = c.id;
      track.innerHTML = `
        <div class="swipe-actions">
          <button class="swipe-action delete" data-swipe="delete">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/></svg>
            Eliminar
          </button>
          <button class="swipe-action mute" data-swipe="mute">
            <svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/></svg>
            Silenciar
          </button>
          <button class="swipe-action pin" data-swipe="pin">
            <svg viewBox="0 0 24 24"><path d="M12 2l1.5 5.5L19 9l-4.5 3.5L16 18l-4-3-4 3 1.5-5.5L5 9l5.5-1.5z"/></svg>
            Fijar
          </button>
        </div>
        <div class="chat-row ${c.unread>0?'unread':''}" data-id="${c.id}">
          ${renderRowHTML(c)}
          <div class="divider"></div>
        </div>
      `;
      chatList.appendChild(track);
      bindRow(track, c.id);
    });

    updateUnreadTabBadge();
  }

  /* -------- gestos: tap, swipe, long-press -------- */
  function bindRow(track, id){
    const row = track.querySelector('.chat-row');
    let downX=0, downY=0, curX=0, dragging=false, swiped=false;
    let pressTimer=null, longPressed=false;
    const SWIPE_MAX = 222; // 3 botones x 74px

    function openMenu(){
      longPressed = true;
      if(navigator.vibrate) navigator.vibrate(10);
      showContextMenu(id, row);
    }

    row.addEventListener('pointerdown', (e) => {
      if(e.pointerType === 'mouse' && e.button !== 0) return;
      downX = e.clientX; downY = e.clientY; curX = 0;
      dragging = false; longPressed = false;
      row.classList.add('pressed');
      pressTimer = setTimeout(openMenu, 480);
    });

    row.addEventListener('pointermove', (e) => {
      const dx = e.clientX - downX;
      const dy = e.clientY - downY;
      if(!dragging && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)){
        dragging = true;
        clearTimeout(pressTimer);
        row.classList.remove('pressed');
      }
      if(Math.abs(dy) > 10 && !dragging){
        clearTimeout(pressTimer);
      }
      if(dragging){
        curX = Math.max(-SWIPE_MAX, Math.min(0, dx + (swiped ? -SWIPE_MAX : 0)));
        row.style.transform = 'translateX(' + curX + 'px)';
      }
    });

    function endDrag(){
      clearTimeout(pressTimer);
      row.classList.remove('pressed');
      if(dragging){
        if(curX < -SWIPE_MAX/2){
          row.style.transform = 'translateX(-'+SWIPE_MAX+'px)';
          swiped = true;
        } else {
          row.style.transform = 'translateX(0px)';
          swiped = false;
        }
      }
      dragging = false;
    }
    row.addEventListener('pointerup', (e) => {
      endDrag();
      if(!longPressed && !dragging && Math.abs(e.clientX-downX)<6 && Math.abs(e.clientY-downY)<6){
        openChat(id);
      }
    });
    row.addEventListener('pointercancel', endDrag);
    row.addEventListener('pointerleave', () => { if(dragging) endDrag(); });

    track.querySelectorAll('.swipe-action').forEach(btn => {
      btn.addEventListener('click', () => {
        const action = btn.dataset.swipe;
        row.style.transform = 'translateX(0px)';
        swiped = false;
        handleAction(action, id);
      });
    });
  }

  function openChat(id){
    const c = chats.get(id);
    if(!c) return;
    if(c.unread > 0){
      c.unread = 0;
      render();
    }
    if(typeof window.onChatOpen === 'function') window.onChatOpen(id, c);
  }

  /* -------- menú contextual con efecto de cristal -------- */
  function showContextMenu(id, rowEl){
    const c = chats.get(id);
    if(!c) return;
    activeChatId = id;

    const rect = rowEl.getBoundingClientRect();
    ctxClone.style.width = (rect.width - 16) + 'px';
    ctxClone.style.top = rect.top + 'px';
    ctxClone.innerHTML = renderRowHTML(c);
    ctxClone.querySelector('.divider')?.remove();

    // posicionar menú justo debajo (o encima si no cabe)
    const menuHeight = 300;
    const vh = window.innerHeight;
    let menuTop = rect.bottom + 10;
    if(menuTop + menuHeight > vh - 20){
      menuTop = rect.top - menuHeight - 10;
      if(menuTop < 60) menuTop = 60;
    }
    ctxMenu.style.top = menuTop + 'px';

    document.getElementById('pinLabel').textContent = c.pinned ? 'Dejar de fijar' : 'Fijar';
    document.getElementById('unreadLabel').textContent = c.unread > 0 ? 'Marcar como leído' : 'Marcar como no leído';
    document.getElementById('muteLabel').textContent = c.muted ? 'Activar notificaciones' : 'Silenciar';

    ctxOverlay.classList.add('show');
  }

  function closeContextMenu(){
    ctxOverlay.classList.remove('show');
    activeChatId = null;
  }
  ctxOverlay.addEventListener('click', (e) => {
    if(e.target === ctxOverlay) closeContextMenu();
  });

  document.querySelectorAll('.ctx-item').forEach(item => {
    item.addEventListener('click', () => {
      const action = item.dataset.action;
      const id = activeChatId;
      closeContextMenu();
      handleAction(action, id);
    });
  });

  function handleAction(action, id){
    const c = chats.get(id);
    if(!c) return;
    const labels = {
      pin: c.pinned ? 'Chat desfijado' : 'Chat fijado',
      unread: c.unread>0 ? 'Marcado como leído' : 'Marcado como no leído',
      mute: c.muted ? 'Notificaciones activadas' : 'Notificaciones silenciadas',
      transfer: 'Selecciona un archivo para enviar',
      info: 'Abriendo info de contacto…',
      delete: 'Chat eliminado'
    };

    if(action === 'pin') c.pinned = !c.pinned;
    if(action === 'unread') c.unread = c.unread > 0 ? 0 : 1;
    if(action === 'mute') c.muted = !c.muted;

    if(action === 'delete'){
      chats.delete(id);
      render();
      showToast(labels.delete, false);
      if(typeof window.onChatAction === 'function') window.onChatAction('delete', id);
      return;
    }

    render();
    showToast(labels[action] || '', action !== 'delete');
    if(typeof window.onChatAction === 'function') window.onChatAction(action, id, c);
  }

  /* -------- barra de búsqueda / filtros -------- */
  searchInput.addEventListener('input', render);
  document.querySelectorAll('.seg-item').forEach(seg => {
    seg.addEventListener('click', () => {
      document.querySelectorAll('.seg-item').forEach(s => s.classList.remove('active'));
      seg.classList.add('active');
      activeFilter = seg.dataset.filter;
      render();
    });
  });

  document.getElementById('composeBtn').addEventListener('click', () => {
    if(typeof window.onCompose === 'function') window.onCompose();
    else showToast('Nuevo chat…', true);
  });
  document.getElementById('editBtn').addEventListener('click', () => {
    if(typeof window.onEditMode === 'function') window.onEditMode();
  });

  let toastTimer;
  function showToast(text, success){
    if(!text) return;
    toastText.textContent = text;
    toast.querySelector('svg').style.display = success ? 'block' : 'none';
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
  }
  window.showToast = showToast;

  /* ============ API PÚBLICA para integrar con datos reales ============ */

  // Agrega o actualiza un chat.
  // data: {id, name, lastMessage, time, sortTime(number ms), unread(int),
  //        pinned(bool), muted(bool), typing(bool), online(bool),
  //        avatarUrl(string), avatarText(string), avatarColor(css)}
  window.addChat = function(data){
    if(!data || !data.id) return;
    const existing = chats.get(data.id) || {};
    const merged = Object.assign({
      unread:0, pinned:false, muted:false, typing:false,
      avatarText: initials(data.name)
    }, existing, data);
    chats.set(data.id, merged);
    render();
  };

  window.updateChat = function(id, patch){
    const c = chats.get(id);
    if(!c) return;
    Object.assign(c, patch);
    render();
  };

  window.removeChat = function(id){
    chats.delete(id);
    render();
  };

  window.setChatUnread = function(id, count){
    const c = chats.get(id);
    if(!c) return;
    c.unread = count;
    render();
  };

  window.setChatTyping = function(id, isTyping){
    const c = chats.get(id);
    if(!c) return;
    c.typing = isTyping;
    render();
  };

  window.clearAllChats = function(){
    chats.clear();
    render();
  };

  render();
})();
</script>
