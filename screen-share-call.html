<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title></title>
<style>
  :root{
    --bg-deep:#05070C;
    --bg-panel:rgba(255,255,255,0.08);
    --stroke:rgba(255,255,255,0.14);
    --text-hi:#F5F7FA;
    --text-lo:rgba(245,247,250,0.6);
    --accent:#3AA9FF;
    --accent-2:#7B61FF;
    --live-red:#FF453A;
    --ok-green:#30D158;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html,body{
    height:100%;
    background:var(--bg-deep);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
    overflow:hidden;
    color:var(--text-hi);
  }

  /* ============ FONDO AMBIENTAL ============ */
  .ambient{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    background:var(--bg-deep);
  }
  .orb{
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.55;
    will-change:transform;
  }
  .orb1{
    width:340px;height:340px;
    background:radial-gradient(circle, #3AA9FF, transparent 70%);
    top:-90px;left:-60px;
    animation:driftA 16s ease-in-out infinite;
  }
  .orb2{
    width:300px;height:300px;
    background:radial-gradient(circle, #7B61FF, transparent 70%);
    bottom:-80px;right:-70px;
    animation:driftB 18s ease-in-out infinite;
  }
  .orb3{
    width:220px;height:220px;
    background:radial-gradient(circle, #16C2C2, transparent 70%);
    top:40%;right:10%;
    animation:driftC 20s ease-in-out infinite;
  }
  @keyframes driftA{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(40px,60px) scale(1.15);}
  }
  @keyframes driftB{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(-50px,-30px) scale(1.1);}
  }
  @keyframes driftC{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(-30px,40px) scale(0.9);}
  }

  /* ============ CONTENEDOR PRINCIPAL (vista completa) ============ */
  .call-full{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    flex-direction:column;
    height:100dvh;
    height:100vh;
    transition:opacity 0.38s ease, transform 0.38s cubic-bezier(.34,1.3,.64,1);
  }
  body.minimized .call-full{
    opacity:0;
    transform:scale(0.88);
    pointer-events:none;
  }

  /* ============ BARRA SUPERIOR ============ */
  .top-bar{
    padding:calc(var(--safe-top) + 10px) 14px 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-shrink:0;
  }
  .top-btn{
    width:36px;height:36px;
    border-radius:50%;
    border:none;
    background:var(--bg-panel);
    -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px);
    display:flex;align-items:center;justify-content:center;
    color:var(--text-hi);
    flex-shrink:0;
    transition:background 0.15s, transform 0.12s;
  }
  .top-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .top-btn:active{transform:scale(0.9);background:rgba(255,255,255,0.16);}

  .status-pill{
    display:flex;
    align-items:center;
    gap:7px;
    padding:6px 14px;
    border-radius:20px;
    background:var(--bg-panel);
    -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px);
    border:1px solid var(--stroke);
    font-size:13px;
    font-weight:600;
    letter-spacing:0.2px;
  }
  .live-dot{
    width:7px;height:7px;
    border-radius:50%;
    background:var(--live-red);
    box-shadow:0 0 0 0 rgba(255,69,58,0.6);
    animation:liveDotPulse 1.6s ease-out infinite;
  }
  @keyframes liveDotPulse{
    0%{box-shadow:0 0 0 0 rgba(255,69,58,0.55);}
    70%{box-shadow:0 0 0 7px rgba(255,69,58,0);}
    100%{box-shadow:0 0 0 0 rgba(255,69,58,0);}
  }
  .call-timer{
    font-variant-numeric:tabular-nums;
    color:var(--text-lo);
    font-weight:500;
  }

  .signal-bars{
    display:flex;
    align-items:flex-end;
    gap:2px;
    height:13px;
  }
  .signal-bars span{
    width:3px;
    background:var(--ok-green);
    border-radius:1px;
  }
  .signal-bars span:nth-child(1){height:40%;}
  .signal-bars span:nth-child(2){height:65%;}
  .signal-bars span:nth-child(3){height:85%;}
  .signal-bars span:nth-child(4){height:100%;}

  /* ============ ESCENARIO: pantalla compartida ============ */
  .stage-wrap{
    flex:1;
    padding:6px 14px 10px;
    display:flex;
    min-height:0;
    position:relative;
  }
  .stage{
    flex:1;
    border-radius:26px;
    background:linear-gradient(160deg,#12151D,#0A0C12);
    border:1px solid var(--stroke);
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
    box-shadow:0 30px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.05);
    transition:filter 0.4s ease, opacity 0.4s ease;
  }
  .stage.not-sharing{
    filter:blur(14px) brightness(0.55);
  }

  .stage-chrome{
    display:flex;
    align-items:center;
    gap:8px;
    padding:12px 14px;
    border-bottom:1px solid rgba(255,255,255,0.06);
    flex-shrink:0;
  }
  .chrome-dot{width:9px;height:9px;border-radius:50%;}
  .chrome-dot.r{background:#FF5F57;}
  .chrome-dot.y{background:#FEBC2E;}
  .chrome-dot.g{background:#28C840;}
  .chrome-bar{
    flex:1;
    height:22px;
    border-radius:8px;
    background:rgba(255,255,255,0.06);
    margin-left:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
  }
  .chrome-bar svg{width:10px;height:10px;stroke:rgba(255,255,255,0.35);fill:none;stroke-width:2;}

  .stage-content{
    flex:1;
    padding:22px;
    display:flex;
    flex-direction:column;
    gap:14px;
    position:relative;
    overflow:hidden;
  }
  .skel-row{
    height:14px;
    border-radius:7px;
    background:linear-gradient(90deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.14) 50%, rgba(255,255,255,0.05) 100%);
    background-size:200% 100%;
    animation:shimmer 2.4s ease-in-out infinite;
  }
  @keyframes shimmer{
    0%{background-position:200% 0;}
    100%{background-position:-200% 0;}
  }
  .skel-row.w60{width:60%;}
  .skel-row.w80{width:80%;}
  .skel-row.w40{width:40%;}
  .skel-row.tall{height:120px;border-radius:16px;margin-top:6px;}

  .stage-label{
    position:absolute;
    left:18px;
    bottom:18px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 13px;
    border-radius:16px;
    background:rgba(10,12,18,0.55);
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.08);
    font-size:12.5px;
    font-weight:500;
    color:var(--text-lo);
  }
  .stage-label svg{width:13px;height:13px;stroke:var(--text-lo);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  .not-sharing-overlay{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:12px;
    z-index:3;
  }
  .stage.not-sharing ~ .not-sharing-overlay,
  .stage-wrap.paused .not-sharing-overlay{
    display:flex;
  }
  .not-sharing-icon{
    width:56px;height:56px;
    border-radius:50%;
    background:rgba(255,255,255,0.1);
    display:flex;align-items:center;justify-content:center;
  }
  .not-sharing-icon svg{width:26px;height:26px;stroke:var(--text-hi);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .not-sharing-overlay p{font-size:14px;color:var(--text-lo);font-weight:500;}

  /* ============ CONNECTING OVERLAY ============ */
  .connecting-overlay{
    position:absolute;
    inset:14px;
    border-radius:26px;
    z-index:20;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    background:rgba(5,7,12,0.7);
    -webkit-backdrop-filter:blur(20px);
    backdrop-filter:blur(20px);
    opacity:1;
    transition:opacity 0.5s ease;
  }
  .connecting-overlay.hide{
    opacity:0;
    pointer-events:none;
  }
  .pulse-rings{
    position:relative;
    width:84px;height:84px;
    display:flex;align-items:center;justify-content:center;
  }
  .pulse-rings .core{
    width:34px;height:34px;
    border-radius:50%;
    background:linear-gradient(145deg,var(--accent),var(--accent-2));
    box-shadow:0 0 20px rgba(58,169,255,0.6);
  }
  .pulse-rings .ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1.5px solid rgba(58,169,255,0.5);
    animation:ringExpand 1.8s ease-out infinite;
  }
  .pulse-rings .ring.r2{animation-delay:0.6s;}
  .pulse-rings .ring.r3{animation-delay:1.2s;}
  @keyframes ringExpand{
    0%{transform:scale(0.4);opacity:0.8;}
    100%{transform:scale(1.6);opacity:0;}
  }
  .connecting-text{
    font-size:14px;
    font-weight:500;
    color:var(--text-lo);
    letter-spacing:0.2px;
  }

  /* ============ PIP (video propio) ============ */
  .self-pip{
    position:absolute;
    width:104px;
    height:148px;
    border-radius:18px;
    overflow:hidden;
    background:linear-gradient(160deg,#1B1E27,#0E1015);
    border:1px solid rgba(255,255,255,0.14);
    box-shadow:0 12px 30px rgba(0,0,0,0.5);
    z-index:5;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:none;
    transition:box-shadow 0.2s ease;
  }
  .self-pip.dragging{
    box-shadow:0 18px 40px rgba(0,0,0,0.6);
  }
  .self-pip .avatar-fill{
    width:44px;height:44px;
    border-radius:50%;
    background:rgba(255,255,255,0.12);
    display:flex;align-items:center;justify-content:center;
  }
  .self-pip .avatar-fill svg{width:24px;height:24px;fill:rgba(255,255,255,0.55);}
  .self-pip.cam-on{
    background:linear-gradient(160deg,#274064,#101728);
  }
  .self-pip.cam-on .avatar-fill{display:none;}
  .self-pip .cam-gradient-fx{
    position:absolute;
    inset:0;
    opacity:0;
    background:
      radial-gradient(circle at 30% 25%, rgba(122,180,255,0.35), transparent 55%),
      radial-gradient(circle at 70% 75%, rgba(123,97,255,0.3), transparent 55%);
  }
  .self-pip.cam-on .cam-gradient-fx{opacity:1;}
  .mute-badge{
    position:absolute;
    left:6px;
    bottom:6px;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--live-red);
    display:none;
    align-items:center;
    justify-content:center;
  }
  .self-pip.muted .mute-badge{display:flex;}
  .mute-badge svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;}

  /* ============ MENU DESPLEGABLE ============ */
  .more-menu{
    position:absolute;
    top:calc(var(--safe-top) + 52px);
    right:14px;
    width:200px;
    border-radius:16px;
    background:rgba(24,26,34,0.85);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    backdrop-filter:blur(24px) saturate(160%);
    border:1px solid var(--stroke);
    box-shadow:0 20px 46px rgba(0,0,0,0.5);
    overflow:hidden;
    z-index:30;
    opacity:0;
    transform:translateY(-8px) scale(0.95);
    pointer-events:none;
    transition:opacity 0.2s ease, transform 0.2s cubic-bezier(.3,1.2,.5,1);
  }
  .more-menu.show{
    opacity:1;
    transform:translateY(0) scale(1);
    pointer-events:auto;
  }
  .menu-item{
    display:flex;
    align-items:center;
    gap:11px;
    padding:12px 14px;
    font-size:14.5px;
    font-weight:500;
    color:var(--text-hi);
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .menu-item:last-child{border-bottom:none;}
  .menu-item:active{background:rgba(255,255,255,0.06);}
  .menu-item svg{width:17px;height:17px;stroke:var(--text-lo);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

  /* ============ BARRA DE CONTROLES ============ */
  .controls-wrap{
    flex-shrink:0;
    padding:10px 14px calc(14px + var(--safe-bottom));
    display:flex;
    justify-content:center;
  }
  .controls{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 12px;
    border-radius:34px;
    background:rgba(255,255,255,0.07);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    backdrop-filter:blur(24px) saturate(160%);
    border:1px solid var(--stroke);
    box-shadow:0 18px 40px rgba(0,0,0,0.4);
  }
  .ctrl-btn{
    width:52px;height:52px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,0.1);
    color:var(--text-hi);
    display:flex;align-items:center;justify-content:center;
    position:relative;
    transition:background 0.18s, transform 0.12s;
    flex-shrink:0;
  }
  .ctrl-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .ctrl-btn:active{transform:scale(0.9);}
  .ctrl-btn.off{background:#fff;color:#0A0C12;}
  .ctrl-btn.sharing{background:linear-gradient(145deg,var(--accent),var(--accent-2));color:#fff;}
  .ctrl-btn.end-call{
    width:60px;height:52px;
    border-radius:26px;
    background:var(--live-red);
  }
  .ctrl-btn.end-call svg{width:22px;height:22px;}
  .ctrl-btn.end-call:active{background:#E0362C;}

  /* waveform del micrófono activo */
  .mic-wave{
    position:absolute;
    bottom:-3px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:flex-end;
    gap:2px;
    height:10px;
  }
  .mic-wave span{
    width:2.5px;
    border-radius:2px;
    background:var(--ok-green);
    animation:waveBar 0.9s ease-in-out infinite;
  }
  .mic-wave span:nth-child(1){height:4px;animation-delay:0s;}
  .mic-wave span:nth-child(2){height:9px;animation-delay:0.15s;}
  .mic-wave span:nth-child(3){height:6px;animation-delay:0.3s;}
  .mic-wave span:nth-child(4){height:10px;animation-delay:0.45s;}
  @keyframes waveBar{
    0%,100%{transform:scaleY(0.4);}
    50%{transform:scaleY(1);}
  }

  /* ============ BURBUJA MINIMIZADA ============ */
  .call-mini{
    position:fixed;
    right:16px;
    bottom:calc(24px + var(--safe-bottom));
    width:66px;
    height:66px;
    border-radius:50%;
    z-index:50;
    background:linear-gradient(155deg,#1c2030,#0c0e14);
    border:1px solid rgba(255,255,255,0.16);
    box-shadow:0 16px 34px rgba(0,0,0,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transform:scale(0.55);
    pointer-events:none;
    transition:opacity 0.38s ease, transform 0.38s cubic-bezier(.34,1.3,.64,1), box-shadow 0.2s ease;
    touch-action:none;
  }
  body.minimized .call-mini{
    opacity:1;
    transform:scale(1);
    pointer-events:auto;
  }
  .call-mini.dragging{box-shadow:0 22px 44px rgba(0,0,0,0.65);}
  .call-mini .mini-ring{
    position:absolute;
    inset:-3px;
    border-radius:50%;
    border:2px solid rgba(58,169,255,0.55);
    animation:ringExpand 2.2s ease-out infinite;
  }
  .call-mini svg{width:22px;height:22px;stroke:var(--text-hi);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .mini-dot{
    position:absolute;
    top:6px;right:6px;
    width:9px;height:9px;
    border-radius:50%;
    background:var(--live-red);
    border:2px solid #0c0e14;
  }
  .mini-timer{
    position:absolute;
    bottom:-20px;
    left:50%;
    transform:translateX(-50%);
    font-size:10.5px;
    font-weight:600;
    color:var(--text-lo);
    white-space:nowrap;
  }
</style>
</head>
<body>

<div class="ambient">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>

<div class="call-full" id="callFull">

  <div class="top-bar">
    <button class="top-btn" id="minimizeBtn" aria-label="Minimizar" title="Minimizar">
      <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </button>

    <div class="status-pill">
      <span class="live-dot"></span>
      <span class="call-timer" id="callTimer">00:00</span>
      <span class="signal-bars"><span></span><span></span><span></span><span></span></span>
    </div>

    <button class="top-btn" id="moreBtn" aria-label="Más opciones" title="Más opciones">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
    </button>

    <div class="more-menu" id="moreMenu">
      <div class="menu-item" data-action="invite">
        <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
        <span>Invitar</span>
      </div>
      <div class="menu-item" data-action="chat">
        <svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7A8.4 8.4 0 0 1 3.5 11.5 8.5 8.5 0 0 1 12 3a8.5 8.5 0 0 1 9 8.5z"/></svg>
        <span>Chat</span>
      </div>
      <div class="menu-item" data-action="effects">
        <svg viewBox="0 0 24 24"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg>
        <span>Efectos</span>
      </div>
      <div class="menu-item" data-action="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>Ajustes</span>
      </div>
    </div>
  </div>

  <div class="stage-wrap" id="stageWrap">
    <div class="stage" id="stage">

      <div class="connecting-overlay" id="connectingOverlay">
        <div class="pulse-rings">
          <div class="ring r1"></div>
          <div class="ring r2"></div>
          <div class="ring r3"></div>
          <div class="core"></div>
        </div>
        <div class="connecting-text">Conectando pantalla…</div>
      </div>

      <div class="stage-chrome">
        <span class="chrome-dot r"></span>
        <span class="chrome-dot y"></span>
        <span class="chrome-dot g"></span>
        <div class="chrome-bar">
          <svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        </div>
      </div>

      <div class="stage-content">
        <div class="skel-row w40"></div>
        <div class="skel-row w80"></div>
        <div class="skel-row w60"></div>
        <div class="skel-row tall"></div>
        <div class="skel-row w60"></div>
        <div class="skel-row w40"></div>
      </div>

      <div class="stage-label">
        <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
        <span>Compartiendo tu pantalla</span>
      </div>
    </div>

    <div class="not-sharing-overlay" id="notSharingOverlay">
      <div class="not-sharing-icon">
        <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/><path d="M4 4l16 16"/></svg>
      </div>
      <p>No estás compartiendo tu pantalla</p>
    </div>

    <div class="self-pip" id="selfPip">
      <div class="cam-gradient-fx"></div>
      <div class="avatar-fill">
        <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 6v2h18v-2c0-3.5-4-6-9-6z"/></svg>
      </div>
      <div class="mute-badge">
        <svg viewBox="0 0 24 24"><path d="M1 1l22 22M9 9v3a3 3 0 0 0 5.1 2.1M15 9.3V5a3 3 0 0 0-5.9-.7M5 10v1a7 7 0 0 0 10.6 6M12 18v3M8 21h8"/></svg>
      </div>
    </div>
  </div>

  <div class="controls-wrap">
    <div class="controls">
      <button class="ctrl-btn" id="micBtn" aria-label="Silenciar micrófono">
        <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>
        <span class="mic-wave" id="micWave"><span></span><span></span><span></span><span></span></span>
      </button>
      <button class="ctrl-btn off" id="camBtn" aria-label="Activar cámara">
        <svg viewBox="0 0 24 24"><path d="M15 10l6-3v10l-6-3M3 6h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/></svg>
      </button>
      <button class="ctrl-btn sharing" id="shareBtn" aria-label="Detener pantalla compartida">
        <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
      </button>
      <button class="ctrl-btn end-call" id="endBtn" aria-label="Colgar">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 8c-2.6 0-5.1.5-7.4 1.5-.6.3-.9 1-.7 1.6l1 3c.2.6.8 1 1.4.9.9-.2 1.9-.3 2.7-.1.7.2 1.2.8 1.2 1.5v1.8c0 .7.5 1.2 1.1 1.3 1.6.3 3.3.3 4.9 0 .6-.1 1.1-.6 1.1-1.3v-1.8c0-.7.5-1.3 1.2-1.5.9-.2 1.8-.1 2.7.1.6.1 1.2-.3 1.4-.9l1-3c.2-.6-.1-1.3-.7-1.6C17.1 8.5 14.6 8 12 8z"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- Burbuja flotante cuando la llamada está minimizada -->
<div class="call-mini" id="callMini">
  <div class="mini-ring"></div>
  <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
  <span class="mini-dot"></span>
  <span class="mini-timer" id="miniTimer">00:00</span>
</div>

<script>
(function(){
  const body = document.body;
  const callFull = document.getElementById('callFull');
  const callMini = document.getElementById('callMini');
  const minimizeBtn = document.getElementById('minimizeBtn');
  const moreBtn = document.getElementById('moreBtn');
  const moreMenu = document.getElementById('moreMenu');
  const connectingOverlay = document.getElementById('connectingOverlay');
  const stage = document.getElementById('stage');
  const notSharingOverlay = document.getElementById('notSharingOverlay');
  const selfPip = document.getElementById('selfPip');
  const stageWrap = document.getElementById('stageWrap');
  const micBtn = document.getElementById('micBtn');
  const camBtn = document.getElementById('camBtn');
  const shareBtn = document.getElementById('shareBtn');
  const endBtn = document.getElementById('endBtn');
  const callTimer = document.getElementById('callTimer');
  const miniTimer = document.getElementById('miniTimer');

  /* ---------- estado de conexión ---------- */
  setTimeout(() => {
    connectingOverlay.classList.add('hide');
    startTimer();
  }, 1800);

  /* ---------- temporizador de llamada ---------- */
  let seconds = 0;
  let timerInterval = null;
  function formatTime(s){
    const m = Math.floor(s/60).toString().padStart(2,'0');
    const sec = (s%60).toString().padStart(2,'0');
    return m+':'+sec;
  }
  function startTimer(){
    if(timerInterval) return;
    timerInterval = setInterval(() => {
      seconds++;
      const t = formatTime(seconds);
      callTimer.textContent = t;
      miniTimer.textContent = t;
    }, 1000);
  }
  function stopTimer(){
    clearInterval(timerInterval);
    timerInterval = null;
  }
  window.startCallTimer = startTimer;
  window.stopCallTimer = stopTimer;

  /* ---------- minimizar / restaurar ---------- */
  function setMinimized(state){
    body.classList.toggle('minimized', state);
    if(typeof window.onMinimizeChange === 'function') window.onMinimizeChange(state);
  }
  minimizeBtn.addEventListener('click', () => setMinimized(true));
  window.minimizeCall = () => setMinimized(true);
  window.restoreCall = () => setMinimized(false);

  /* click (no arrastre) en la burbuja restaura la llamada */
  let miniMoved = false;
  callMini.addEventListener('click', () => {
    if(!miniMoved) setMinimized(false);
  });

  /* arrastrar la burbuja minimizada libremente por la pantalla */
  (function makeDraggable(el, onMoveFlag){
    let dragging = false, offX = 0, offY = 0, moved = false;

    el.addEventListener('pointerdown', (e) => {
      dragging = true;
      moved = false;
      miniMoved = false;
      const rect = el.getBoundingClientRect();
      offX = e.clientX - rect.left;
      offY = e.clientY - rect.top;
      el.classList.add('dragging');
      el.style.right = 'auto';
      el.style.bottom = 'auto';
      el.style.left = rect.left + 'px';
      el.style.top = rect.top + 'px';
      if(el.setPointerCapture) el.setPointerCapture(e.pointerId);
    });

    el.addEventListener('pointermove', (e) => {
      if(!dragging) return;
      moved = true;
      miniMoved = true;
      let x = e.clientX - offX;
      let y = e.clientY - offY;
      const w = el.offsetWidth, h = el.offsetHeight;
      x = Math.max(6, Math.min(window.innerWidth - w - 6, x));
      y = Math.max(6, Math.min(window.innerHeight - h - 6, y));
      el.style.left = x + 'px';
      el.style.top = y + 'px';
    });

    function release(e){
      if(!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
      if(moved){
        // ajustar (snap) al borde más cercano
        const rect = el.getBoundingClientRect();
        const w = el.offsetWidth;
        const goRight = (rect.left + w/2) > window.innerWidth/2;
        el.style.transition = 'left 0.32s cubic-bezier(.34,1.4,.64,1), top 0.32s ease';
        el.style.left = (goRight ? window.innerWidth - w - 12 : 12) + 'px';
        setTimeout(() => { el.style.transition = ''; }, 340);
      }
      setTimeout(() => { miniMoved = false; }, 50);
    }
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
  })(callMini);

  /* arrastrar el video propio (PiP) dentro del escenario */
  (function makePipDraggable(el, container){
    let dragging = false, offX = 0, offY = 0;

    el.addEventListener('pointerdown', (e) => {
      dragging = true;
      const rect = el.getBoundingClientRect();
      offX = e.clientX - rect.left;
      offY = e.clientY - rect.top;
      el.classList.add('dragging');
      el.style.right = 'auto';
      el.style.bottom = 'auto';
      if(el.setPointerCapture) el.setPointerCapture(e.pointerId);
    });

    el.addEventListener('pointermove', (e) => {
      if(!dragging) return;
      const bounds = container.getBoundingClientRect();
      let x = e.clientX - offX - bounds.left;
      let y = e.clientY - offY - bounds.top;
      x = Math.max(10, Math.min(bounds.width - el.offsetWidth - 10, x));
      y = Math.max(10, Math.min(bounds.height - el.offsetHeight - 10, y));
      el.style.left = x + 'px';
      el.style.top = y + 'px';
    });

    function release(){
      dragging = false;
      el.classList.remove('dragging');
    }
    el.addEventListener('pointerup', release);
    el.addEventListener('pointerleave', release);
    el.addEventListener('pointercancel', release);
  })(selfPip, stageWrap);
  // posición inicial del PiP (esquina inferior derecha del escenario)
  selfPip.style.right = '16px';
  selfPip.style.bottom = '16px';

  /* ---------- menú "más opciones" ---------- */
  moreBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    moreMenu.classList.toggle('show');
  });
  document.addEventListener('click', (e) => {
    if(!moreMenu.contains(e.target) && e.target !== moreBtn){
      moreMenu.classList.remove('show');
    }
  });
  document.querySelectorAll('.menu-item').forEach(item => {
    item.addEventListener('click', () => {
      moreMenu.classList.remove('show');
      if(typeof window.onMenuAction === 'function') window.onMenuAction(item.dataset.action);
    });
  });

  /* ---------- controles: mic / cámara / compartir / colgar ---------- */
  let micOn = true, camOn = false, sharing = true;

  micBtn.addEventListener('click', () => {
    micOn = !micOn;
    micBtn.classList.toggle('off', !micOn);
    selfPip.classList.toggle('muted', !micOn);
    if(typeof window.onToggleMic === 'function') window.onToggleMic(micOn);
  });

  camBtn.addEventListener('click', () => {
    camOn = !camOn;
    camBtn.classList.toggle('off', !camOn);
    selfPip.classList.toggle('cam-on', camOn);
    if(typeof window.onToggleCamera === 'function') window.onToggleCamera(camOn);
  });

  shareBtn.addEventListener('click', () => {
    sharing = !sharing;
    shareBtn.classList.toggle('sharing', sharing);
    stage.classList.toggle('not-sharing', !sharing);
    stageWrap.classList.toggle('paused', !sharing);
    if(typeof window.onToggleShare === 'function') window.onToggleShare(sharing);
  });

  endBtn.addEventListener('click', () => {
    stopTimer();
    if(typeof window.onEndCall === 'function') window.onEndCall(seconds);
  });

  /* ---------- API pública ---------- */
  window.setCallStatusText = function(text){
    // reservado para integraciones futuras (p. ej. "Reconectando…")
  };
})();
</script>

</body>
</html>
